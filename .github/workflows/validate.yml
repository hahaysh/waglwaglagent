name: Validate

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    name: Bicep syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep build --file infra/backend.bicep --stdout > /dev/null
      - run: az bicep build --file infra/sql.bicep --stdout > /dev/null

  api:
    name: API tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m ruff check .
      - run: python -m pytest tests -q
      - name: Test release packaging and deployment preflight
        working-directory: .
        run: |
          python -m ruff check scripts
          python -m pytest scripts/tests -q

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Test login setup guidance without OAuth
        run: npm run test:e2e -- --grep '@oauth-disabled-guidance'
        env:
          WAGL_TEST_AUTH_DISABLED: "1"
      - run: npm run build
      - name: Verify the production standalone archive
        run: python3 "$GITHUB_WORKSPACE/scripts/package_web.py" --output "$RUNNER_TEMP/validated-web.zip"
      - run: npm audit --omit=dev --audit-level=moderate
