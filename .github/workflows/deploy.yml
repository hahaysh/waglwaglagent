name: Deploy waglwaglagent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waglwaglagent-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  package:
    name: Package web and API releases
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build without production secrets
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Package only standalone runtime files
        run: python scripts/package_web.py --output "${{ runner.temp }}/waglwaglagent.zip"
      - name: Package Linux API dependencies and pinned Copilot runtime
        shell: bash
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/api-packages"
          runtime="$RUNNER_TEMP/copilot-runtime"
          python -m pip install --require-hashes --only-binary=:all: \
            --target "$packages" -r services/api/requirements.lock
          PYTHONPATH="$packages" python -c \
            "import mssql_python; from sqlalchemy.dialects import registry; registry.load('mssql.mssqlpython')"
          PYTHONPATH="$packages" COPILOT_CLI_EXTRACT_DIR="$runtime" \
            python -c "from copilot._cli_download import download_cli; download_cli()"
          python scripts/package_api.py --dependencies "$packages" --runtime "$runtime" \
            --output "$RUNNER_TEMP/waglwaglagent-api.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waglwaglagent-api-${{ github.sha }}
          path: ${{ runner.temp }}/waglwaglagent-api.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waglwaglagent-${{ github.sha }}
          path: ${{ runner.temp }}/waglwaglagent.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy API then web
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: azure-production
      url: ${{ vars.AZURE_WEB_APP_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
      AZURE_WEB_APP_URL: ${{ vars.AZURE_WEB_APP_URL }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP }}
      AZURE_API_URL: ${{ vars.AZURE_API_URL }}
      WAGL_APP_CONFIG_ENDPOINT: ${{ vars.WAGL_APP_CONFIG_ENDPOINT }}
      WAGL_APP_CONFIG_LABEL: production-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: waglwaglagent-${{ github.sha }}
          path: ${{ runner.temp }}/waglwaglagent-release
      - name: Check deployment identity configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_WEB_APP AZURE_WEB_APP_URL AZURE_API_APP AZURE_API_URL WAGL_APP_CONFIG_ENDPOINT; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing azure-production variable: $variable"
              exit 1
            fi
          done
      - name: Sign in with GitHub OIDC
        id: azure-login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: waglwaglagent-api-${{ github.sha }}
          path: ${{ runner.temp }}/waglwaglagent-release
      - name: Validate API target and production references before upload
        run: python scripts/check_api_deployment.py
      - name: Deploy API and activate migration startup
        shell: bash
        run: |
          set -euo pipefail
          deployment_status=$(az webapp deploy \
            --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_API_APP" --src-path "$RUNNER_TEMP/waglwaglagent-release/waglwaglagent-api.zip" \
            --type zip --clean true --restart false --async true --track-status false \
            --timeout 1200000 --query status --output tsv)
          if [[ "$deployment_status" != "4" ]]; then
            echo "::error::API ZIP deployment did not reach Kudu success status 4."
            exit 1
          fi
          az webapp config set \
            --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_API_APP" --startup-file "python start_api.py" \
            --generic-configurations '{"healthCheckPath":"/ready"}' --output none
          az webapp restart \
            --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_API_APP" --output none
      - name: Verify API database and Redis readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 25 --retry-all-errors --retry-delay 10 \
            --max-time 20 --output "$RUNNER_TEMP/api-readiness.json" "$AZURE_API_URL/ready"
          python -c 'import json,sys; assert json.load(open(sys.argv[1])) == {"status":"ok"}' \
            "$RUNNER_TEMP/api-readiness.json"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 20 "$AZURE_API_URL/credentials")
          if [[ "$status" != "401" ]]; then
            echo "::error::API must reject unauthenticated credential access (received $status)."
            exit 1
          fi
      - name: Validate target, production configuration and API before upload
        run: python scripts/check_web_deployment.py
      - name: Deploy the tested standalone archive
        shell: bash
        run: |
          set -euo pipefail
          deployment_status=$(az webapp deploy \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEB_APP" \
            --src-path "$RUNNER_TEMP/waglwaglagent-release/waglwaglagent.zip" \
            --type zip --clean true --restart false --async true --track-status false \
            --timeout 1200000 --query status --output tsv)
          if [[ "$deployment_status" != "4" ]]; then
            echo "::error::Web ZIP deployment did not reach Kudu success status 4."
            exit 1
          fi
      - name: Activate standalone startup after successful upload
        shell: bash
        run: |
          set -euo pipefail
          az webapp config set \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEB_APP" \
            --startup-file "node server.js" --output none
          az webapp restart \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEB_APP" --output none
      - name: Verify the deployed release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 10 \
            --max-time 20 --output /dev/null "$AZURE_WEB_APP_URL/"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 20 "$AZURE_WEB_APP_URL/api/gateway/credentials")
          if [[ "$status" != "401" ]]; then
            echo "::error::Expected unauthenticated gateway status 401, received $status."
            exit 1
          fi
          printf '### waglwaglagent release\nCommit: `%s`\n\nURL: %s\n' \
            "$GITHUB_SHA" "$AZURE_WEB_APP_URL" >> "$GITHUB_STEP_SUMMARY"
          printf '\nAPI: %s\n' "$AZURE_API_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out of Azure
        if: always() && steps.azure-login.outcome == 'success'
        run: az logout
