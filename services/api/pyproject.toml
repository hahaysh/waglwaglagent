[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "waglwaglagent-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[mssql-python]>=2.1,<2.2",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<8",
  "cryptography>=44",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "litellm==1.100.4",
  "github-copilot-sdk==1.0.34",
  "filelock>=4.2.1,<5",
  "pillow>=12,<14",
  "azure-identity>=1.25,<2",
  "azure-keyvault-secrets>=4.10,<5",
  "azure-appconfiguration>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "pip>=26.3,<27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]